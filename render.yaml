services:
  - type: web
    name: youtube-watch-party
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: APP_NAME
        value: Zynlivo
      - key: SUPPORT_EMAIL
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: STRIPE_PAYMENT_LINK
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Zynlivo
      - key: SMTP_SECURITY
        value: starttls
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
